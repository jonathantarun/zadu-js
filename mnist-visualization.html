        const avgX = digitPoints.reduce((sum, p) => sum + p[0], 0) / digitPoints.length;
        const avgY = digitPoints.reduce((sum, p) => sum + p[1], 0) / digitPoints.length;
        digitCenters.push({digit, x: avgX, y: avgY});
      }
    }
    
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.font = 'bold 28px Arial';
    digitCenters.forEach(({digit, x, y}) => {
      const pos = scale(x, y);
      ctx.strokeText(digit.toString(), pos.x - 10, pos.y + 10);
      ctx.fillText(digit.toString(), pos.x - 10, pos.y + 10);
    });
    
    ctx.fillStyle = '#333';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('MNIST UMAP - Colored by Trustworthiness', 20, 30);
  </script>
</body>
</html>
